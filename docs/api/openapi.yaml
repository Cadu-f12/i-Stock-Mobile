openapi: 3.1.0
info:
  title: I-Stock Manager API
  description: REST API for inventory management, authentication, and users.
  contact:
    name: I-Stock Manager
  version: v1
servers:
- url: http://localhost:8080
  description: Generated server url
security:
- bearerAuth: []
tags:
- name: Authentication
  description: Obtain a JWT access token
- name: Manufacturers
  description: Manufacturer records and contacts
- name: Users
  description: User account operations
- name: Pastilles
  description: Cutting inserts and inventory levels
paths:
  /user/updateUser/{id}:
    put:
      tags:
      - Users
      summary: Update user
      operationId: updateUser
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequestDTO'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UserResponseDTO'
  /supplier/updateSupplier/{id}:
    put:
      tags:
      - supplier-controller
      operationId: updateManufacturer
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupplierRequestDTO'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SupplierResponseDTO'
  /pastilles/{id}:
    get:
      tags:
      - Pastilles
      summary: Get a pastille
      description: Returns a pastille with its stock, manufacturer, suppliers, and
        movements.
      operationId: findById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Pastille returned
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PastilleDTO'
        '404':
          description: Pastille not found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiError'
    put:
      tags:
      - Pastilles
      summary: Update a pastille
      operationId: updateById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePastilleRequest'
        required: true
      responses:
        '200':
          description: Pastille updated
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PastilleDTO'
        '400':
          description: Invalid request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Pastille or manufacturer not found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiError'
  /manufacturer/updateManufacturer/{id}:
    put:
      tags:
      - Manufacturers
      summary: Update manufacturer
      operationId: updateManufacturer_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManufacturerRequestDTO'
        required: true
      responses:
        '200':
          description: Manufacturer updated
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ManufacturerResponseDTO'
        '404':
          description: Manufacturer not found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiError'
  /user/fetchUser:
    post:
      tags:
      - Users
      summary: Find user by email
      operationId: fetchUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequestDTO'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UserResponseDTO'
  /user/createUser:
    post:
      tags:
      - Users
      summary: Create user
      operationId: createUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequestDTO'
        required: true
      responses:
        '201':
          description: User created
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UserResponseDTO'
        '409':
          description: User already exists
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UserResponseDTO'
  /supplier/fetchSupplier:
    post:
      tags:
      - supplier-controller
      operationId: fetchManuf
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupplierRequestDTO'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SupplierResponseDTO'
  /supplier/createSupplier:
    post:
      tags:
      - supplier-controller
      operationId: createSupplier
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupplierRequestDTO'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SupplierResponseDTO'
  /pastilles:
    get:
      tags:
      - Pastilles
      summary: List pastilles
      description: Optionally filter pastilles that are below their minimum stock
        level.
      operationId: findAll
      parameters:
      - name: on_alert
        in: query
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: Pastilles returned
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PastilleListDTO'
        '401':
          description: Authentication required
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PastilleListDTO'
    post:
      tags:
      - Pastilles
      summary: Register a pastille
      operationId: registerPastille
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistryPastilleRequest'
        required: true
      responses:
        '201':
          description: Pastille registered
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PastilleListDTO'
        '400':
          description: Invalid request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: SKU code already exists
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiError'
  /manufacturer/fetchManufacturer:
    post:
      tags:
      - Manufacturers
      summary: Find manufacturer by name
      operationId: fetchManufacturer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManufacturerRequestDTO'
        required: true
      responses:
        '200':
          description: Manufacturer returned
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ManufacturerResponseDTO'
        '404':
          description: Manufacturer not found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiError'
  /manufacturer/createManufacturer:
    post:
      tags:
      - Manufacturers
      summary: Create manufacturer
      operationId: createManufacturer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManufacturerRequestDTO'
        required: true
      responses:
        '201':
          description: Manufacturer created
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ManufacturerResponseDTO'
  /api/public/auth/login:
    post:
      tags:
      - Authentication
      summary: Log in
      description: Authenticate with email and password. Use the returned token as
        a Bearer token for protected endpoints.
      operationId: login
      requestBody:
        description: Development seed credentials
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              Development administrator:
                description: Development administrator
                value:
                  email: admin@istock.com
                  password: admin
        required: true
      responses:
        '200':
          description: Authentication succeeded
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/LoginResponse'
      security: []
  /user:
    get:
      tags:
      - Users
      summary: List users
      operationId: getAllUsers
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserResponseDTO'
  /user/{id}:
    get:
      tags:
      - Users
      summary: Get user by ID
      operationId: getUser
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: User returned
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UserResponseDTO'
        '401':
          description: Authentication required
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UserResponseDTO'
  /supplier:
    get:
      tags:
      - supplier-controller
      operationId: getAllSuppliers
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SupplierResponseDTO'
  /supplier/{id}:
    get:
      tags:
      - supplier-controller
      operationId: getManufacturer
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SupplierResponseDTO'
  /manufacturer:
    get:
      tags:
      - Manufacturers
      summary: List manufacturers
      operationId: getAllManufacturers
      responses:
        '200':
          description: Manufacturers returned
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ManufacturerResponseDTO'
  /manufacturer/{id}:
    get:
      tags:
      - Manufacturers
      summary: Get manufacturer by ID
      operationId: getManufacturer_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Manufacturer returned
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ManufacturerResponseDTO'
        '404':
          description: Manufacturer not found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiError'
  /user/deleteUser/{id}:
    delete:
      tags:
      - Users
      summary: Delete user
      operationId: deleteUser
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UserResponseDTO'
  /supplier/deleteSupplier/{id}:
    delete:
      tags:
      - supplier-controller
      operationId: deleteSupplier
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SupplierResponseDTO'
  /manufacturer/deleteManufacturer/{id}:
    delete:
      tags:
      - Manufacturers
      summary: Delete manufacturer
      operationId: deleteManufacturer
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Manufacturer deleted
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ManufacturerResponseDTO'
        '404':
          description: Manufacturer not found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiError'
components:
  schemas:
    UserRequestDTO:
      type: object
      properties:
        role:
          type: string
        name:
          type: string
        email:
          type: string
        password:
          type: string
        isActive:
          type: boolean
    MovementDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        quantity:
          type: integer
          format: int32
        date_time:
          type: string
          format: date-time
        reason:
          $ref: '#/components/schemas/ReasonMovementDTO'
        user:
          $ref: '#/components/schemas/UserDTO'
    ReasonMovementDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        description:
          type: string
        type:
          type: string
          enum:
          - IN
          - OUT
    UserDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    UserResponseDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        email:
          type: string
        isActive:
          type: boolean
        movement:
          type: array
          items:
            $ref: '#/components/schemas/MovementDTO'
    PastilleListDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        sku_code:
          type: string
        description:
          type: string
        minimum_stock_level:
          type: integer
          format: int32
        current_balance:
          type: integer
          format: int32
        manufacturer:
          type: string
    SupplierRequestDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          maxLength: 120
          minLength: 0
        contact:
          type: string
          maxLength: 120
          minLength: 0
        isActive:
          type: boolean
        pastilles:
          type: array
          items:
            $ref: '#/components/schemas/PastilleListDTO'
      required:
      - name
    SupplierResponseDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        contact:
          type: string
        is_active:
          type: boolean
        pastilles:
          type: array
          items:
            $ref: '#/components/schemas/PastilleListDTO'
    UpdatePastilleRequest:
      type: object
      properties:
        description:
          type: string
          maxLength: 255
          minLength: 0
        manufacturer_id:
          type: integer
          format: int64
        minimum_stock_level:
          type: integer
          format: int32
        supplier_ids:
          type: array
          items:
            type: integer
            format: int64
      required:
      - description
      - manufacturer_id
      - minimum_stock_level
    ApiError:
      type: object
      properties:
        status:
          type: integer
          format: int32
        error:
          type: string
        message:
          type: string
        fields:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      properties:
        field:
          type: string
        message:
          type: string
    ManufacturerResponseDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        contact:
          type: string
        isActive:
          type: boolean
        pastilles:
          type: array
          items:
            $ref: '#/components/schemas/PastilleListDTO'
    PastilleDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        sku_code:
          type: string
        description:
          type: string
        stock:
          $ref: '#/components/schemas/StockDTO'
        manufacturer:
          $ref: '#/components/schemas/ManufacturerResponseDTO'
        suppliers:
          type: array
          items:
            $ref: '#/components/schemas/SupplierResponseDTO'
        movements:
          type: array
          items:
            $ref: '#/components/schemas/MovementDTO'
    StockDTO:
      type: object
      properties:
        minimum_level:
          type: integer
          format: int32
        current_balance:
          type: integer
          format: int32
        on_alert:
          type: boolean
    Manufacturer:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        contact:
          type: string
        pastilles:
          type: array
          items:
            $ref: '#/components/schemas/Pastille'
        active:
          type: boolean
    ManufacturerRequestDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        pastilles:
          type: array
          items:
            $ref: '#/components/schemas/Pastille'
        name:
          type: string
        contact:
          type: string
        isActive:
          type: boolean
    Movement:
      type: object
      properties:
        id:
          type: integer
          format: int64
        pastille:
          $ref: '#/components/schemas/Pastille'
        user:
          $ref: '#/components/schemas/User'
        reasonMovement:
          $ref: '#/components/schemas/ReasonMovement'
        quantity:
          type: integer
          format: int32
        dateTime:
          type: string
          format: date-time
    Pastille:
      type: object
      properties:
        id:
          type: integer
          format: int64
        skuCode:
          type: string
        description:
          type: string
        minimumStockLevel:
          type: integer
          format: int32
        currentBalance:
          type: integer
          format: int32
        manufacturer:
          $ref: '#/components/schemas/Manufacturer'
        suppliers:
          type: array
          items:
            $ref: '#/components/schemas/Supplier'
        movements:
          type: array
          items:
            $ref: '#/components/schemas/Movement'
    ReasonMovement:
      type: object
      properties:
        id:
          type: integer
          format: int64
        description:
          type: string
        type:
          type: string
          enum:
          - IN
          - OUT
        movements:
          type: array
          items:
            $ref: '#/components/schemas/Movement'
        active:
          type: boolean
    Supplier:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        contact:
          type: string
        pastilles:
          type: array
          items:
            $ref: '#/components/schemas/Pastille'
        active:
          type: boolean
    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
        role:
          type: string
        name:
          type: string
        email:
          type: string
        password:
          type: string
          writeOnly: true
        active:
          type: boolean
    RegistryPastilleRequest:
      type: object
      properties:
        sku_code:
          type: string
          maxLength: 30
          minLength: 0
        description:
          type: string
          maxLength: 255
          minLength: 0
        minimum_stock_level:
          type: integer
          format: int32
        manufacturer_id:
          type: integer
          format: int64
        supplier_ids:
          type: array
          items:
            type: integer
            format: int64
      required:
      - manufacturer_id
      - minimum_stock_level
      - sku_code
    LoginRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
  securitySchemes:
    bearerAuth:
      type: http
      name: bearerAuth
      scheme: bearer
      bearerFormat: JWT
